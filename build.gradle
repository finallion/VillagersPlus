plugins {
	id "architectury-plugin" version "3.5.170"
	id "dev.architectury.loom-no-remap" version "1.17.493" apply false
	id "com.gradleup.shadow" version "9.6.1" apply false
	id "me.modmuss50.mod-publish-plugin" version "1.1.0"
}

architectury {
	minecraft = rootProject.minecraft_version
}

subprojects {
	apply plugin: "dev.architectury.loom-no-remap"

	dependencies {
		minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
	}
}

allprojects {
	apply plugin: "java-library"
	apply plugin: "architectury-plugin"
	apply plugin: "maven-publish"

	base {
		archivesName = rootProject.archives_base_name
	}
	version = "${rootProject.mod_version}+mc${rootProject.minecraft_version}"
	group = rootProject.maven_group

	repositories {
		mavenLocal()
		maven { url 'https://maven.neoforged.net/releases' }
		maven { url 'https://jitpack.io' }
	}

	tasks.withType(JavaCompile).configureEach {
		options.encoding = "UTF-8"
		options.release = 25
	}

	java {
		withSourcesJar()
	}
}


evaluationDependsOn(":common")
evaluationDependsOn(":fabric")
evaluationDependsOn(":neoforge")

publishMods {
	dryRun = providers.environmentVariable("PUBLISH_LIVE").getOrElse("false") != "true"

	version = project.version
	type = STABLE
	displayName = "VillagersPlus ${rootProject.mod_version} for MC ${rootProject.minecraft_version}"
	changelog = providers.environmentVariable("CHANGELOG")
			.getOrElse("See the GitHub release for the changelog.")

	def token = { String env, String property ->
		providers.environmentVariable(env).orElse(providers.gradleProperty(property)).orElse("")
	}

	def cfOptions = curseforgeOptions {
		accessToken = token("CURSEFORGE_TOKEN", "curseforgeToken")
		projectId = providers.gradleProperty("villagersplusCurseforgeId").getOrElse("000000")
		minecraftVersions.add(rootProject.minecraft_version)
		// CurseForge needs both environment flags.
		clientRequired = true
		serverRequired = true
	}

	def mrOptions = modrinthOptions {
		accessToken = token("MODRINTH_TOKEN", "modrinthToken")
		projectId = providers.gradleProperty("villagersplusModrinthId").getOrElse("000000")
		minecraftVersions.add(rootProject.minecraft_version)
	}

	curseforge("curseforgeFabric") {
		from cfOptions
		file project(":fabric")
		modLoaders.add("fabric")
		requires { slug = "fabric-api" }
		// CurseForge slug, not the mod id: the project is "villagerstradingplus".
		requires { slug = "villagerstradingplus" }
	}

	curseforge("curseforgeNeoForge") {
		from cfOptions
		file project(":neoforge")
		modLoaders.add("neoforge")
		requires { slug = "villagerstradingplus" }
	}

	modrinth("modrinthFabric") {
		from mrOptions
		file project(":fabric")
		version = "${project.version}-fabric"
		displayName = "VillagersPlus ${rootProject.mod_version} for MC ${rootProject.minecraft_version} (Fabric)"
		modLoaders.add("fabric")
		requires { slug = "fabric-api" }
		requires { slug = "villagertradingplus" }
	}

	modrinth("modrinthNeoForge") {
		from mrOptions
		file project(":neoforge")
		version = "${project.version}-neoforge"
		displayName = "VillagersPlus ${rootProject.mod_version} for MC ${rootProject.minecraft_version} (NeoForge)"
		modLoaders.add("neoforge")
		requires { slug = "villagertradingplus" }
	}

	github {
		accessToken = providers.environmentVariable("GITHUB_TOKEN").getOrElse("")
		repository = "finallion/VillagersPlus_-FABRIC-"
		commitish = providers.environmentVariable("GITHUB_SHA").getOrElse(rootProject.minecraft_version)
		file project(":fabric")
		additionalFiles.from(project(":neoforge").tasks.named("shadowJar").flatMap { it.archiveFile })
		modLoaders.add("fabric")
		modLoaders.add("neoforge")
	}
}
