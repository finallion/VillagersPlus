modLoader = "javafml"
# NeoForge javafml declares version 3, so the range [3,) accepts it.
loaderVersion = "[3,)"
license = "CC0-1.0"

[[mods]]
modId = "villagersplus"
version = "${version}"
displayName = "VillagersPlus"
authors = "Lion"
description = '''
New villagers, new trades and new beautiful and useful workstations.
'''
logoFile = "villagersplus_logo.png"

[[mixins]]
config = "villagersplus.mixins.json"

[[mixins]]
config = "villagersplus-common.mixins.json"

[[dependencies.villagersplus]]
modId = "neoforge"
type = "required"
versionRange = "[26.2.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.villagersplus]]
modId = "minecraft"
type = "required"
versionRange = "[26.2,26.3)"
ordering = "NONE"
side = "BOTH"

# Load order only. The trade code comes from VillagerTradingPlus.
[[dependencies.villagersplus]]
modId = "villagertradingplus"
type = "required"
versionRange = "[1.1.0,)"
ordering = "AFTER"
side = "BOTH"
