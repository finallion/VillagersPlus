modLoader = "javafml"
# NeoForge javafml declares version 3, so the range [3,) accepts it.
loaderVersion = "[3,)"
license = "GPL-3.0-only"

[[mods]]
modId = "villagersplus"
version = "${version}"
displayName = "VillagersPlus"
authors = "LithiumPlus"
displayURL = "https://modrinth.com/mod/villagersplus"
issueTrackerURL = "https://github.com/finallion/VillagersPlus/issues"
description = '''
This mod adds new villager types, trades and workstations.

Support: https://www.patreon.com/cw/LithiumPlus
'''
logoFile = "villagersplus_logo.png"

[[mixins]]
config = "villagersplus.mixins.json"

[[mixins]]
config = "villagersplus-common.mixins.json"

[[dependencies.villagersplus]]
modId = "neoforge"
type = "required"
versionRange = "[26.2.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.villagersplus]]
modId = "minecraft"
type = "required"
versionRange = "[26.2,26.3)"
ordering = "NONE"
side = "BOTH"

# Load order only. The trade code comes from VillagersTradingPlus.
[[dependencies.villagersplus]]
modId = "villagertradingplus"
type = "required"
versionRange = "[1.1.0,2)"
ordering = "AFTER"
side = "BOTH"
