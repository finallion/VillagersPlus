apply plugin: "com.gradleup.shadow"

architectury {
	platformSetupLoomIde()
	neoForge()
}

configurations {
	common
	shadowCommon
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentNeoForge.extendsFrom common
}

loom {
	neoForge {
		accessTransformer file("src/main/resources/META-INF/accesstransformer.cfg")
	}
}

dependencies {
	neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

	common(project(path: ":common")) { transitive false }

	// changing = true keeps a republished library from being served out of the Gradle cache.
	implementation("lion.villagertradingplus:villagertradingplus-neoforge:${rootProject.villagertradingplus_version}+mc${rootProject.minecraft_version}") {
		changing = true
	}
	shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }
}

processResources {
	inputs.property "version", project.version

	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": project.version
	}
}

jar {
	archiveClassifier.set("raw")
}

shadowJar {
	exclude "fabric.mod.json"
	exclude "architectury.common.json"

	dependsOn jar
	mainSpec.sourcePaths.clear()
	from(zipTree(jar.archiveFile))
	configurations = [project.configurations.shadowCommon]
	archiveClassifier.set(null)
	archiveFileName = "${rootProject.mod_id}-${project.name}-mc${rootProject.minecraft_version}-${rootProject.mod_version}.jar"
	zip64 = true
}

assemble.dependsOn shadowJar

shadow.addShadowVariantIntoJavaComponent = false

configurations {
	apiElements {
		outgoing.artifacts.clear()
		outgoing.artifact(shadowJar)
	}
	runtimeElements {
		outgoing.artifacts.clear()
		outgoing.artifact(shadowJar)
	}
}

sourcesJar {
	def commonSources = project(":common").sourcesJar
	dependsOn commonSources
	from commonSources.archiveFile.map { zipTree(it) }
	duplicatesStrategy 'exclude'
}

publishing {
	publications {
		mavenNeoForge(MavenPublication) {
			artifactId = rootProject.archives_base_name + "-" + project.name
			from components.java
		}
	}

	repositories {
	}
}

configurations.all {
	resolutionStrategy.cacheChangingModulesFor 0, "seconds"
}
