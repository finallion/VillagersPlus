# Publishes the mod to Modrinth, CurseForge and GitHub Releases.
#
# NOT ARMED. publishMods runs in dry-run mode unless PUBLISH_LIVE is "true", so by default this
# workflow builds everything, prints what it would upload, and uploads nothing. To arm it:
#
#   1. Settings -> Secrets and variables -> Actions -> Variables: add PUBLISH_LIVE = true
#   2. Same page, Secrets: add MODRINTH_TOKEN and CURSEFORGE_TOKEN
#   3. Put the real project ids into gradle.properties of your Gradle user home, or pass them
#      as -PvillagersplusModrinthId=... -PvillagersplusCurseforgeId=... below
#
# Publish VillagerTradingPlus first. This mod declares it as a required dependency, and a release
# here that points at a library version nobody can download is a broken release.
#
# Trigger: a tag such as v4.0.0+mc1.21.1. The mod version alone is not enough, since the same mod
# version is released for several Minecraft versions.

name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # Keep in sync with build.yml.
  VTP_REF: '1.21.1'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: checkout VillagerTradingPlus
        uses: actions/checkout@v4
        with:
          repository: finallion/VillagerTradingPlus
          ref: ${{ env.VTP_REF }}
          path: villagertradingplus

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: setup jdk 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: make gradle wrappers executable
        run: chmod +x ./gradlew ./villagertradingplus/gradlew

      - name: publish the library to mavenLocal
        working-directory: villagertradingplus
        run: ./gradlew publishToMavenLocal --stacktrace

      - name: publish
        env:
          PUBLISH_LIVE: ${{ vars.PUBLISH_LIVE }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publishMods --stacktrace

      - name: capture what would have been published
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: build/mod-publish-plugin/
          if-no-files-found: ignore
