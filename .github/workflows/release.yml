# Publish VillagerTradingPlus first, because this mod requires it.

name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # Same value as VTP_REF in build.yml.
  VTP_REF: '26.1'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: checkout VillagerTradingPlus
        uses: actions/checkout@v4
        with:
          repository: finallion/VillagerTradingPlus
          ref: ${{ env.VTP_REF }}
          path: villagertradingplus

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: setup jdk 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          cache: gradle

      - name: make gradle wrappers executable
        run: chmod +x ./gradlew ./villagertradingplus/gradlew

      - name: publish the library to mavenLocal
        working-directory: villagertradingplus
        run: ./gradlew publishToMavenLocal --stacktrace

      - name: publish
        env:
          PUBLISH_LIVE: ${{ vars.PUBLISH_LIVE }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publishMods --stacktrace

      - name: capture what would have been published
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: build/mod-publish-plugin/
          if-no-files-found: ignore
