# Builds the mod on every push and pull request.
#
# VillagersPlus resolves VillagerTradingPlus from mavenLocal (see fabric/build.gradle and
# neoforge/build.gradle), so the library has to be checked out and published locally before this
# repo can compile at all. A fresh runner has an empty local Maven repository.

name: build
on: [pull_request, push]

env:
  # Branch of the library that matches this branch. Bump this together with minecraft_version when
  # opening a new Minecraft branch, otherwise the build silently compiles against the old library.
  VTP_REF: '1.21.1'

jobs:
  build:
    strategy:
      matrix:
        # Java 21 is the floor: options.release = 21 and both loader manifests require it.
        java: [21]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: checkout VillagerTradingPlus
        uses: actions/checkout@v4
        with:
          repository: finallion/VillagerTradingPlus
          ref: ${{ env.VTP_REF }}
          path: villagertradingplus

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: gradle

      - name: make gradle wrappers executable
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew ./villagertradingplus/gradlew

      - name: publish the library to mavenLocal
        working-directory: villagertradingplus
        run: ./gradlew publishToMavenLocal --stacktrace

      - name: build
        run: ./gradlew build --stacktrace

      - name: capture build artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
          if-no-files-found: error
