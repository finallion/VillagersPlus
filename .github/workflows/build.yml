# Builds the mod on every push and pull request.
#
# VillagerTradingPlus comes from mavenLocal, so the job publishes it first.

name: build
on: [pull_request, push]

env:
  # VillagerTradingPlus branch for this Minecraft version.
  VTP_REF: '26.3'

jobs:
  build:
    strategy:
      matrix:
        java: [25]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: checkout VillagerTradingPlus
        uses: actions/checkout@v4
        with:
          repository: finallion/VillagerTradingPlus
          ref: ${{ env.VTP_REF }}
          path: villagertradingplus

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: gradle

      - name: make gradle wrappers executable
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew ./villagertradingplus/gradlew

      - name: publish the library to mavenLocal
        working-directory: villagertradingplus
        run: ./gradlew publishToMavenLocal --stacktrace

      - name: build
        run: ./gradlew build --stacktrace

      - name: capture build artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
          if-no-files-found: error
